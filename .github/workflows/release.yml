# Release pipeline: on a v* tag, build the Windows MSI (windows-latest) and the
# Linux AppImage + deb (ubuntu-latest), then publish one GitHub Release that the
# AppImage auto-updater reads.
#
# PREREQUISITES (one-time, owner-driven — see docs/superpowers/specs/2026-09-01-
# plexus-installer-design.md):
#   1. The @pragmatic-tech-ai/* framework packages (mural, fresco, todl, and
#      their transitive @pragmatic-tech-ai deps like todl-runtime) must be
#      published to GitHub Packages (https://npm.pkg.github.com) under the
#      pragmatic-tech-ai org. Local dev keeps using Verdaccio; CI reads them here.
#   2. Add a repo secret PACKAGES_TOKEN — a PAT with `read:packages` on the
#      pragmatic-tech-ai org. The default GITHUB_TOKEN is scoped to this repo's
#      owner (napryaglo) and cannot read another org's packages, so a separate
#      token is required for the npm install. GITHUB_TOKEN still creates the
#      Release (same repo, contents:write).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write   # create the GitHub Release
  packages: read    # read @pragmatic-tech-ai/* from GitHub Packages
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CI registry wiring (the repo's committed .npmrc is gitignored and points
      # at local Verdaccio; this writes a CI-only one): public npm for OSS deps,
      # GitHub Packages for the @pragmatic-tech-ai scope.
      - name: Configure npm registries
        shell: bash
        run: |
          {
            printf 'registry=https://registry.npmjs.org/\n'
            printf '@pragmatic-tech-ai:registry=https://npm.pkg.github.com\n'
            printf '//npm.pkg.github.com/:_authToken=%s\n' "${PACKAGES_TOKEN}"
          } > .npmrc
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # The committed package-lock.json pins Verdaccio (localhost) tarball URLs,
      # which CI can't reach, so `npm ci` would fail. Drop it and resolve fresh
      # against the CI registries above.
      - name: Install (fresh resolve)
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
      - run: npm run build
      - name: Package + publish
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
