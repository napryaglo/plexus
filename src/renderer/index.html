<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tight CSP for the renderer: no remote code, no remote origins. The icon
         font (Material Symbols Outlined) is now self-hosted — a local @font-face
         in src/fonts.css imported by the bootstrap, resolving from disk before
         the shell mounts (no Google-CDN round-trips gating first paint). -->
    <title>Plexus</title>

    <style>
        html, body { height: 100%; margin: 0; overflow: hidden;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        /* Custom title bar (VSCode-style): the OS frame is hidden
           (titleBarStyle: 'hidden'); this HTML band is the app's own draggable
           title strip, with the native min/max/close buttons floating over its
           right end via the Window Controls Overlay. Colours are seeded to the
           MaterialDark title-bar surface and re-tinted live by title-bar.ts
           (CSS vars) on every scheme change. `-webkit-app-region: drag` makes
           the strip move the window; the OS owns the button hit area. */
        body { display: flex; flex-direction: column; }
        #titlebar {
            flex: 0 0 32px; height: 32px;
            display: flex; align-items: center;
            -webkit-app-region: drag;
            user-select: none;
            padding-left: 12px;
            /* Room on the right so a longer title never slides under the WCO
               buttons (~138px on Windows). */
            padding-right: 140px;
            background: var(--titlebar-bg, #1c1b1f);
            color: var(--titlebar-fg, #cac4d0);
            font: 12px/1 "Segoe UI", system-ui, sans-serif;
        }
        /* macOS floats its traffic lights top-LEFT (no WCO), so swap the insets. */
        body.is-mac #titlebar { padding-left: 78px; padding-right: 12px; }
        #titlebar .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #app { flex: 1 1 auto; min-height: 0; width: 100%; background: #fff;
               overflow: hidden; cursor: default; }
        #app svg { display: block; }
    </style>
</head>
<body>
    <div id="titlebar"><span id="plexus-title" class="title">Plexus</span></div>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
