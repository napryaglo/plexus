<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tight CSP for the renderer: no remote code, no remote origins. The icon
         font (Material Symbols Outlined) is now self-hosted — a local @font-face
         in src/fonts.css imported by the bootstrap, resolving from disk before
         the shell mounts (no Google-CDN round-trips gating first paint). -->
    <title>Plexus</title>

    <style>
        html, body { height: 100%; margin: 0; overflow: hidden;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        /* The mural host fills the whole window and PAINTS the title strip itself
           (EditorShell's Header region → @PlexusTitleBar). The OS frame is hidden
           (titleBarStyle: 'hidden'), so the only chrome left in HTML is invisible
           OS plumbing: #drag-strip below. */
        body { position: relative; }
        /* Near-black (the SolariaMark's own ground) instead of white, so the
           bundle-eval + mount gap never flashes a bare white box and hands off
           seamlessly to the dark app surface. The mural shell paints @Surface
           over this once it mounts. */
        #app { position: absolute; inset: 0; width: 100%; height: 100%;
               background: #0A0A0B; overflow: hidden; cursor: default; }
        #app svg { display: block; }

        /* Boot splash: a static, JS-free branded loading screen painted the
           instant the document parses (well before the ~14 MB renderer bundle
           evaluates), so the window is never empty/white. removeSplash() (called
           from the bootstrap once mural has painted its first frame) fades it out
           via the opacity transition and removes it. The animated SolariaMark
           (from InputData/TechnoDesign) is the loading motion. */
        #splash {
            position: absolute; inset: 0; z-index: 20;
            display: flex; align-items: center; justify-content: center;
            background: #0A0A0B;
        }
        #splash .splash-inner {
            display: flex; flex-direction: column; align-items: center; gap: 26px;
        }
        /* Sized as a fraction of the window (viewport %). width == height keeps
           the mark's original 1:1 aspect ratio; min(…vh, …vw) also caps it by the
           width so it never overflows a narrow window. Scales with the window,
           and the centered column keeps the top/bottom margins balanced. */
        #splash .splash-mark {
            width: min(72vh, 72vw);
            height: min(72vh, 72vw);
            overflow: visible;
        }
        #splash .splash-word {
            color: #E6E5E1; font-weight: 600; letter-spacing: 0.14em;
            font-size: clamp(20px, 2.6vh, 28px);
            -webkit-user-select: none; user-select: none;
        }
        /* SolariaMark animation: the central node breathes; the three holograms
           fade in and out of presence. Keyframes lifted verbatim from the mark's
           source (SolariaMark.dc.html). */
        @keyframes so-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
        @keyframes so-holo  { 0%, 100% { opacity: .3; } 50% { opacity: .6; } }
        #splash .so-dot  { animation: so-pulse 2.4s ease-in-out infinite; }
        #splash .so-holo { animation: so-holo 3.2s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
            #splash .so-dot, #splash .so-holo { animation: none; }
        }
        /* Window-drag affordance: `-webkit-app-region: drag` only works on HTML
           elements, and CSS can't mark a sub-region of mural's SVG — so these
           thin, fully transparent strips sit over the top 32px (the mural-painted
           header) purely to let the OS move the window. The native min/max/close
           buttons (Window Controls Overlay) draw above everything and keep their
           own hit area.
           The header now hosts an INTERACTIVE File menu (mural-painted SVG). A
           drag region would swallow its clicks (drag regions consume mouse events
           at the compositor, and a no-drag overlay won't reliably pass clicks
           through to the SVG beneath), so the affordance is split into two strips
           that FLANK the menu region: the 48px logo box stays draggable on the
           left, the title area stays draggable on the right, and the menu hole
           (48px..112px) is left uncovered so its clicks reach mural. Sized for the
           current File menu; a future task adding Edit/View widens the hole. */
        #drag-logo {
            position: absolute; top: 0; left: 0; width: 48px; height: 32px;
            -webkit-app-region: drag;
            background: transparent; z-index: 10;
        }
        #drag-strip {
            position: absolute; top: 0; left: 112px; right: 0; height: 32px;
            -webkit-app-region: drag;
            background: transparent; z-index: 10;
        }
        /* macOS floats its traffic lights top-LEFT (no WCO): drop the left logo
           drag zone so their hit area wins; the title strip on the right still
           drags. */
        body.is-mac #drag-logo { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- Boot splash (removed by removeSplash() once the shell paints). The
         animated SolariaMark (InputData/TechnoDesign) — a "signal" mark on its
         near-black ground: dashed world ring, walled estates, viewing beams to
         holograms, and a self node that breathes. Static markup + CSS keyframes
         so it animates before any JS runs. -->
    <div id="splash" role="status" aria-label="Loading Plexus">
        <div class="splash-inner">
            <svg class="splash-mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- the near-empty world -->
                <circle cx="100" cy="100" r="92" fill="none" stroke="#3D3B36" stroke-width="1" stroke-dasharray="1.5 9" opacity="0.45"/>
                <!-- other estates: each alone, walled, untouched -->
                <g>
                    <circle cx="150" cy="58" r="13" fill="none" stroke="#3D3B36" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"/>
                    <circle cx="150" cy="58" r="2.2" fill="#8A8780" opacity="0.6"/>
                    <circle cx="156" cy="134" r="13" fill="none" stroke="#3D3B36" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"/>
                    <circle cx="156" cy="134" r="2.2" fill="#8A8780" opacity="0.6"/>
                    <circle cx="60" cy="152" r="13" fill="none" stroke="#3D3B36" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"/>
                    <circle cx="60" cy="152" r="2.2" fill="#8A8780" opacity="0.6"/>
                    <circle cx="122" cy="160" r="13" fill="none" stroke="#3D3B36" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"/>
                    <circle cx="122" cy="160" r="2.2" fill="#8A8780" opacity="0.6"/>
                </g>
                <!-- viewing beams: reach out, stop short -->
                <g stroke="#2EA862" stroke-width="1" stroke-dasharray="2 5" opacity="0.4" fill="none">
                    <line x1="78" y1="86" x2="127.6" y2="66.7"/>
                    <line x1="78" y1="86" x2="135.6" y2="121.4"/>
                    <line x1="78" y1="86" x2="66.3" y2="128.9"/>
                </g>
                <!-- holograms: seen, not met -->
                <g>
                    <circle class="so-holo" cx="127.6" cy="66.7" r="4.5" fill="none" stroke="#2EA862" stroke-width="1" opacity="0.45"/>
                    <circle class="so-holo" cx="135.6" cy="121.4" r="4.5" fill="none" stroke="#2EA862" stroke-width="1" opacity="0.45"/>
                    <circle class="so-holo" cx="66.3" cy="128.9" r="4.5" fill="none" stroke="#2EA862" stroke-width="1" opacity="0.45"/>
                </g>
                <!-- the self, alone in the estate -->
                <circle cx="78" cy="86" r="27" fill="none" stroke="#2EA862" stroke-width="1" stroke-dasharray="2 6" opacity="0.4"/>
                <circle cx="78" cy="86" r="9" fill="none" stroke="#2EA862" stroke-width="1" opacity="0.5"/>
                <circle class="so-dot" cx="78" cy="86" r="5" fill="#2EA862" style="filter:drop-shadow(0 0 8px #2EA862);"/>
            </svg>
            <div class="splash-word">Plexus</div>
        </div>
    </div>
    <div id="drag-logo"></div>
    <div id="drag-strip"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
