<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tight CSP for the renderer: no remote code, no remote origins. The icon
         font (Material Symbols Outlined) is now self-hosted — a local @font-face
         in src/fonts.css imported by the bootstrap, resolving from disk before
         the shell mounts (no Google-CDN round-trips gating first paint). -->
    <title>Plexus</title>

    <style>
        html, body { height: 100%; margin: 0; overflow: hidden;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        /* The mural host fills the whole window and PAINTS the title strip itself
           (EditorShell's Header region → @PlexusTitleBar). The OS frame is hidden
           (titleBarStyle: 'hidden'), so the only chrome left in HTML is invisible
           OS plumbing: #drag-strip below. */
        body { position: relative; }
        #app { position: absolute; inset: 0; width: 100%; height: 100%;
               background: #fff; overflow: hidden; cursor: default; }
        #app svg { display: block; }
        /* Window-drag affordance: `-webkit-app-region: drag` only works on HTML
           elements, and CSS can't mark a sub-region of mural's SVG — so this thin,
           fully transparent strip sits over the top 32px (the mural-painted header)
           purely to let the OS move the window. The native min/max/close buttons
           (Window Controls Overlay) draw above everything and keep their own hit
           area, so no no-drag hole is needed. The header has no interactive
           elements, so covering it is harmless. */
        #drag-strip {
            position: absolute; top: 0; left: 0; right: 0; height: 32px;
            -webkit-app-region: drag;
            background: transparent; z-index: 10;
        }
        /* macOS floats its traffic lights top-LEFT (no WCO): keep the strip clear
           of them so their hit area wins. */
        body.is-mac #drag-strip { left: 78px; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="drag-strip"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
